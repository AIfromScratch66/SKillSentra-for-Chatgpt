<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillSentra Logo Concepts</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f5f5f7; color: #1d1d1f; }
    body { padding: 48px 56px 56px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
    header { margin: 0 0 30px; }
    h1 { margin: 0; font-size: 34px; line-height: 1.15; letter-spacing: -1.2px; font-weight: 700; }
    header p { margin: 10px 0 0; color: #6e6e73; font-size: 16px; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    article { min-height: 270px; padding: 24px 26px 20px; background: rgba(255,255,255,.92); border: 1px solid rgba(0,0,0,.06); border-radius: 24px; box-shadow: 0 8px 28px rgba(0,0,0,.06); }
    article:last-child { grid-column: 1 / -1; width: calc(50% - 11px); justify-self: center; }
    .number { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: #0a84ff; color: #fff; font-size: 14px; font-weight: 700; }
    h2 { display: inline; margin: 0 0 0 10px; font-size: 19px; letter-spacing: -.35px; vertical-align: 3px; }
    .note { margin: 7px 0 2px 42px; color: #86868b; font-size: 13px; }
    img { display: block; width: 100%; height: auto; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>SkillSentra · 三圆弧 Logo 方向</h1>
    <p>三弧以递进半径、顺时针错位和端点交接，表达生生不息的循环。</p>
  </header>
  <main>
    <article><span class="number">01</span><h2>递进环流 · Progressive Flow</h2><p class="note">92 / 76 / 63 三级半径，循环层次最清晰</p><img src="skillsentra-logo-v1-balanced-orbit.svg" alt="方案一"></article>
    <article><span class="number">02</span><h2>太极生长 · Taiji Flow</h2><p class="note">最接近原始图形，S 形生长动势最明确</p><img src="skillsentra-logo-v2-taiji-flow.svg" alt="方案二"></article>
    <article><span class="number">03</span><h2>三元接力 · Triad Relay</h2><p class="note">上、右、左下三向接力，循环方向最鲜明</p><img src="skillsentra-logo-v3-triad-swirl.svg" alt="方案三"></article>
    <article><span class="number">04</span><h2>开放生息 · Open Taiji</h2><p class="note">外、中、下三层呼应，负空间轻盈</p><img src="skillsentra-logo-v4-open-taiji.svg" alt="方案四"></article>
    <article><span class="number">05</span><h2>三阶生环 · Living Orbit</h2><p class="note">90 / 70 / 48 三阶轨道，科技与生命感兼具</p><img src="skillsentra-logo-v5-hub-orbit.svg" alt="方案五"></article>
  </main>
</body>
</html>
