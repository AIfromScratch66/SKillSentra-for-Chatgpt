<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-labelledby="title description">
  <title id="title">SkillSentra mark</title>
  <desc id="description">Two balanced interlocking forms representing human and AI collaboration across the Skill lifecycle</desc>
  <defs>
    <linearGradient id="blueDepth" x1="68" y1="48" x2="192" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#70D7FF"/>
      <stop offset="0.4" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#005BC4"/>
    </linearGradient>
    <linearGradient id="inkDepth" x1="72" y1="52" x2="188" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A5A60"/>
      <stop offset="0.44" stop-color="#262629"/>
      <stop offset="1" stop-color="#080809"/>
    </linearGradient>
    <radialGradient id="blueNode" cx="32%" cy="26%" r="78%">
      <stop offset="0" stop-color="#A9EAFF"/>
      <stop offset="0.42" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0052AD"/>
    </radialGradient>
    <radialGradient id="inkNode" cx="32%" cy="26%" r="78%">
      <stop offset="0" stop-color="#77777E"/>
      <stop offset="0.48" stop-color="#242427"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <filter id="markShadow" x="-18%" y="-18%" width="142%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <mask id="flowGap" maskUnits="userSpaceOnUse" x="20" y="28" width="212" height="222">
      <rect x="20" y="28" width="212" height="222" fill="#FFFFFF"/>
      <path d="M126 43A48 48 0 0 0 126 139A48 48 0 0 1 126 235"
            fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    </mask>
  </defs>

  <g transform="translate(14 1)" filter="url(#markShadow)">
    <g transform="rotate(-16 126 139)" mask="url(#flowGap)">
      <path d="M126 43A96 96 0 0 1 126 235A48 48 0 0 1 126 139A48 48 0 0 0 126 43Z"
            fill="url(#blueDepth)"/>
      <path d="M126 235A96 96 0 0 1 126 43A48 48 0 0 1 126 139A48 48 0 0 0 126 235Z"
            fill="url(#inkDepth)"/>
      <circle cx="126" cy="91" r="13" fill="url(#inkNode)"/>
      <circle cx="126" cy="187" r="13" fill="url(#blueNode)"/>
      <ellipse cx="121.5" cy="86.5" rx="3.6" ry="2.6" fill="#FFFFFF" fill-opacity="0.2"/>
      <ellipse cx="121.5" cy="182.5" rx="3.6" ry="2.6" fill="#FFFFFF" fill-opacity="0.22"/>
    </g>
  </g>
</svg>
