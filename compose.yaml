services:
  skillsentra:
    build:
      context: .
    image: skillsentra:0.8.0
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    ports:
      - "127.0.0.1:8766:8766"
    env_file:
      - .env.production
    environment:
      SKILLSENTRA_HOST: 0.0.0.0
      SKILLSENTRA_PORT: 8766
      SKILLSENTRA_AUTH_MODE: hybrid
      SKILLSENTRA_DEMO_SEED: "false"
      SKILLSENTRA_DATABASE_PATH: /var/lib/skillsentra/skillsentra.db
      SKILLSENTRA_ARTIFACT_DIR: /var/lib/skillsentra/artifacts
    volumes:
      - skillsentra-data:/var/lib/skillsentra
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8766/readyz',timeout=3)); assert d['data']['status']=='ok' and d['data']['database']=='ready'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  skillsentra-data:
